<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇辰导航</title>
  <!-- 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 样式 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部信息：时间 + 天气 -->
  <div class="info-bar">
    <div class="datetime" id="datetime" aria-live="polite"></div>
    <div class="weather" id="weather" aria-live="polite">
      <i class="fas fa-sun" aria-hidden="true"></i>
      <span>北京 · 晴天 25℃</span>
    </div>
  </div>

  <!-- 搜索模块 -->
  <div class="search-container">
    <div class="search-engine" role="group" aria-label="搜索引擎">
      <button class="engine-btn active" data-engine="baidu">百度</button>
      <button class="engine-btn" data-engine="google">搜狗</button>
      <button class="engine-btn" data-engine="bing">必应</button>
    </div>
    <div class="search-box">
      <label for="searchInput" class="sr-only">搜索</label>
      <input type="text" id="searchInput" placeholder="输入关键词搜索...">
      <button id="searchBtn" aria-label="搜索">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>

  <!-- 网址导航 -->
  <div class="bookmarks-section">
    <h2 class="section-title">常用网址</h2>
    <div class="bookmarks-grid" id="bookmarksGrid" role="list"></div>
    <button class="add-btn" id="addBookmarkBtn">
      <i class="fas fa-plus"></i> 添加网址
    </button>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <button class="setting-btn" id="settingBtn" aria-label="设置">
      <i class="fas fa-cog"></i>
    </button>
    <span>© 2025 宇辰导航</span>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="panel-header">
      <h3>个性化设置</h3>
      <button class="close-panel" id="closePanel">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="panel-item">
      <label>主题模式</label>
      <div class="theme-btns">
        <button class="theme-btn" data-theme="light">浅色</button>
        <button class="theme-btn" data-theme="dark">深色</button>
      </div>
    </div>
    <div class="panel-item">
      <label>字体大小</label>
      <div class="font-btns">
        <button class="font-btn" data-size="14">小</button>
        <button class="font-btn" data-size="16">中</button>
        <button class="font-btn" data-size="18">大</button>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">添加网址</h3>
        <button class="close-modal" id="closeModal">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <form id="bookmarkForm" class="modal-form">
        <input type="hidden" id="bookmarkId">
        <div class="form-group">
          <label for="bookmarkName">网站名称</label>
          <input type="text" id="bookmarkName" placeholder="例如：百度" required>
        </div>
        <div class="form-group">
          <label for="bookmarkUrl">网站链接</label>
          <input type="url" id="bookmarkUrl" placeholder="https://" required>
        </div>
        <div class="form-group">
          <label for="bookmarkIcon">图标样式</label>
          <select id="bookmarkIcon">
            <option value="fa-globe">🌍 默认</option>
            <option value="fa-search">🔍 搜索</option>
            <option value="fa-shopping-bag">🛍️ 购物</option>
            <option value="fa-play-circle">🎬 视频</option>
            <option value="fa-music">🎵 音乐</option>
            <option value="fa-code">💻 代码</option>
            <option value="fa-robot">🤖 AI</option>
            <option value="fa-comment-dots">💬 对话</option>
            <option value="fa-image">🖼️ 图片</option>
            <option value="fa-book">📖 阅读</option>
            <option value="fa-weixin">💬 微信</option>
            <option value="fa-brain">🧠 智能</option>
            <option value="fa-palette">🎨 设计</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bookmarkColor">图标背景色</label>
          <input type="color" id="bookmarkColor" value="#409eff">
        </div>
        <div class="modal-btns">
          <button type="button" class="cancel-btn" id="cancelBtn">取消</button>
          <button type="submit" class="confirm-btn">确认</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
